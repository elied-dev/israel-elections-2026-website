name: Release production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Summarize migration
        if: always()
        run: |
          {
            echo '## Production migration'
            echo
            echo "- **Result:** \`${{ job.status }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo '- **Action:** Applied the complete Drizzle migration chain to the protected production database.'
            echo
            echo 'If this step failed, do not treat the application deployment as released. Read the migration logs before retrying.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_STATUS_TOKEN: ${{ secrets.VERCEL_STATUS_TOKEN }}
      VERCEL_PROJECT_ID: prj_euZY1twsxAg8wXHM1b5OkalT8T22
      VERCEL_TEAM_ID: team_wlz8SXBwzC7AA5WYruWvjKtS
    steps:
      - name: Trigger project deployment
        id: trigger
        run: |
          echo "started_at=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" > deploy-hook-response.json
          jq -r '.job.id // "unknown"' deploy-hook-response.json | xargs -I{} echo "hook_job_id={}" >> "$GITHUB_OUTPUT"
      - name: Wait for Vercel deployment
        id: vercel
        run: |
          for attempt in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_STATUS_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&target=production&limit=20")
            deployment=$(jq -c --argjson started_at "${{ steps.trigger.outputs.started_at }}" \
              '[.deployments[] | select(.createdAt >= $started_at)] | sort_by(.createdAt) | last // empty' <<< "$response")
            if [ -n "$deployment" ]; then
              state=$(jq -r '.state' <<< "$deployment")
              url=$(jq -r '.url' <<< "$deployment")
              echo "state=$state" >> "$GITHUB_OUTPUT"
              echo "url=https://$url" >> "$GITHUB_OUTPUT"
              case "$state" in
                READY) exit 0 ;;
                ERROR|CANCELED) echo "Vercel deployment ended as $state" >&2; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo 'Timed out after 10 minutes waiting for Vercel deployment.' >&2
          exit 1
      - name: Summarize deployment
        if: always()
        run: |
          {
            echo '## Production deployment'
            echo
            echo "- **Deploy-hook job:** \`${{ steps.trigger.outputs.hook_job_id || 'not created' }}\`"
            echo "- **Final Vercel state:** \`${{ steps.vercel.outputs.state || 'unknown' }}\`"
            echo "- **Deployment URL:** ${{ steps.vercel.outputs.url || 'not available' }}"
            echo '- **Timeout:** 10 minutes, checked every 10 seconds.'
            echo
            echo 'A release is successful only when migration and Vercel deployment both report success. Check the deployment URL and Vercel runtime logs after every release.'
          } >> "$GITHUB_STEP_SUMMARY"
